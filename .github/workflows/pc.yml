# Sestaví instalátor Evidea Pokladna pro Windows. Spouští se jen ručně (Actions → „Run workflow“).
# Veřejné repo = sestavení zdarma. Zdrojový kód se načte ze soukromého repa (SOURCE_TOKEN, jen pro čtení).
# Vydání má tag pc-1.0.N a NENÍ označené jako „latest“ – telefon si podle „latest“ hledá APK.
name: Evidea Pokladna (Windows)

on:
  workflow_dispatch:

concurrency:
  group: pc
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pc:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Jedn0ta/EvidenZ
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalace knihoven
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # kontrola typů: neblokuje sestavení, chyby se ukážou jako upozornění u běhu
      - name: Kontrola typů
        working-directory: desktop
        run: |
          npx tsc -p tsconfig.json > tsc.txt 2>&1 && echo "typy OK" || {
            msg=$(head -n 60 tsc.txt | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::warning title=Kontrola typů (PC)::$msg"
          }

      - name: Testy (jádro, server, EET, certifikát .p12)
        working-directory: desktop
        run: |
          node build.mjs --test
          # MSYS_NO_PATHCONV: Git Bash na Windows by jinak „/CN=…“ převedl na cestu
          MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 -nodes -keyout k.pem -out c.pem -days 30 -subj "/CN=CZ00000019/C=CZ"
          openssl pkcs12 -export -legacy -inkey k.pem -in c.pem -out t.p12 -passout pass:heslo123 -certpbe PBE-SHA1-RC2-40 2>/dev/null || openssl pkcs12 -export -inkey k.pem -in c.pem -out t.p12 -passout pass:heslo123
          P12_TEST=t.p12 node test/core.test.cjs
          rm -f k.pem c.pem t.p12

      - name: Číslo verze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '[.[].tagName | select(startswith("pc-"))][0]' 2>/dev/null || true)
          N=${LAST##*.}; N=$(( ${N:-0} + 1 ))
          echo "VER=1.0.$N" >> "$GITHUB_ENV"
          cd desktop && npm pkg set version="1.0.$N"

      - name: Sestavení instalátoru
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          node build.mjs
          npx electron-builder --win nsis --x64 --publish never

      - name: Vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "pc-$VER" "desktop/release/Evidea-Pokladna-Setup-$VER.exe" --repo ${{ github.repository }} \
            --title "Evidea Pokladna $VER (Windows)" --notes "Instalátor pokladny Evidea pro Windows 10/11." --latest=false
